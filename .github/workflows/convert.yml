name: Run Horizon Mod Packager

on:
  push:
    paths:
      - 'input_mod.jar'
  workflow_dispatch:

jobs:
  package-mod:
    runs-on: ubuntu-latest
    steps:
      - name: سحب ملفات المستودع
        uses: actions/checkout@v4

      - name: تثبيت مكتبة Gemini
        run: pip install google-genai

      - name: تحويل وتغليف المود بالذكاء الاصطناعي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app.py

      - name: رفع حزمة المود الجاهزة للتركيب
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Ready-Mod
          path: final_output/*

